<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64" shape-rendering="crispEdges">
  <!-- Frame 0 (x: 0..64): Idle Neutral Base -->
  <g transform="translate(0, 0)">
    <!-- Shadow -->
    <ellipse cx="32" cy="58" rx="14" ry="4" fill="rgba(0,0,0,0.2)"/>
    <!-- Body -->
    <rect x="22" y="24" width="20" height="26" rx="4" fill="#8B5CF6"/>
    <!-- Belly -->
    <rect x="26" y="32" width="12" height="14" rx="2" fill="#DDD6FE"/>
    <!-- Head -->
    <rect x="18" y="10" width="28" height="22" rx="6" fill="#A78BFA"/>
    <!-- Hair / Ears -->
    <rect x="18" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <rect x="38" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <!-- Eyes -->
    <rect x="24" y="18" width="4" height="6" rx="1" fill="#1E1B4B"/>
    <rect x="36" y="18" width="4" height="6" rx="1" fill="#1E1B4B"/>
    <!-- Eye Highlights -->
    <rect x="25" y="19" width="2" height="2" fill="#FFFFFF"/>
    <rect x="37" y="19" width="2" height="2" fill="#FFFFFF"/>
    <!-- Cheeks -->
    <rect x="21" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <rect x="39" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <!-- Mouth -->
    <rect x="30" y="25" width="4" height="2" rx="1" fill="#4C1D95"/>
    <!-- Feet -->
    <rect x="22" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
    <rect x="35" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
  </g>

  <!-- Frame 1 (x: 64..128): Idle Breathe In (+1px rise) -->
  <g transform="translate(64, -1)">
    <ellipse cx="32" cy="59" rx="14" ry="4" fill="rgba(0,0,0,0.2)"/>
    <rect x="22" y="24" width="20" height="26" rx="4" fill="#8B5CF6"/>
    <rect x="26" y="32" width="12" height="14" rx="2" fill="#DDD6FE"/>
    <rect x="18" y="10" width="28" height="22" rx="6" fill="#A78BFA"/>
    <rect x="18" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <rect x="38" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <rect x="24" y="18" width="4" height="6" rx="1" fill="#1E1B4B"/>
    <rect x="36" y="18" width="4" height="6" rx="1" fill="#1E1B4B"/>
    <rect x="25" y="19" width="2" height="2" fill="#FFFFFF"/>
    <rect x="37" y="19" width="2" height="2" fill="#FFFFFF"/>
    <rect x="21" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <rect x="39" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <rect x="30" y="25" width="4" height="2" rx="1" fill="#4C1D95"/>
    <rect x="22" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
    <rect x="35" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
  </g>

  <!-- Frame 2 (x: 128..192): Idle Peak (+2px rise & gentle blink) -->
  <g transform="translate(128, -2)">
    <ellipse cx="32" cy="60" rx="13" ry="3.5" fill="rgba(0,0,0,0.18)"/>
    <rect x="22" y="24" width="20" height="26" rx="4" fill="#8B5CF6"/>
    <rect x="26" y="32" width="12" height="14" rx="2" fill="#DDD6FE"/>
    <rect x="18" y="10" width="28" height="22" rx="6" fill="#A78BFA"/>
    <rect x="18" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <rect x="38" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <!-- Blinking Eyes -->
    <rect x="24" y="20" width="5" height="2" rx="1" fill="#1E1B4B"/>
    <rect x="35" y="20" width="5" height="2" rx="1" fill="#1E1B4B"/>
    <rect x="21" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <rect x="39" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <rect x="30" y="25" width="4" height="2" rx="1" fill="#4C1D95"/>
    <rect x="22" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
    <rect x="35" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
  </g>

  <!-- Frame 3 (x: 192..256): Idle Settle (+1px fall) -->
  <g transform="translate(192, -1)">
    <ellipse cx="32" cy="59" rx="14" ry="4" fill="rgba(0,0,0,0.2)"/>
    <rect x="22" y="24" width="20" height="26" rx="4" fill="#8B5CF6"/>
    <rect x="26" y="32" width="12" height="14" rx="2" fill="#DDD6FE"/>
    <rect x="18" y="10" width="28" height="22" rx="6" fill="#A78BFA"/>
    <rect x="18" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <rect x="38" y="8" width="8" height="6" rx="2" fill="#7C3AED"/>
    <rect x="24" y="18" width="4" height="6" rx="1" fill="#1E1B4B"/>
    <rect x="36" y="18" width="4" height="6" rx="1" fill="#1E1B4B"/>
    <rect x="25" y="19" width="2" height="2" fill="#FFFFFF"/>
    <rect x="37" y="19" width="2" height="2" fill="#FFFFFF"/>
    <rect x="21" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <rect x="39" y="24" width="4" height="2" rx="1" fill="#F472B6" opacity="0.7"/>
    <rect x="30" y="25" width="4" height="2" rx="1" fill="#4C1D95"/>
    <rect x="22" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
    <rect x="35" y="48" width="7" height="6" rx="2" fill="#6D28D9"/>
  </g>
</svg>
